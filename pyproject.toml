[project]
name = "roteiros-engine"
version = "0.1.0"
description = "Sistema de producao de roteiros de YouTube por perfil estruturado de canal"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.15.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
