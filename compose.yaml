name: roteiros-engine

services:
  db:
    image: postgres:18
    # One container serves every git worktree the squad opens (one database
    # per worktree, see _docs/process.md), so raising this is cheaper than
    # chasing "FATAL: sorry, too many clients already" showing up as an
    # unrelated-looking test failure once a few agents run suites in
    # parallel.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roteiros
    ports:
      # 5433, nao 5432 - a maquina ja roda outro Postgres nessa porta
      # (outro projeto). Exposto pra `uv run pytest` e
      # `uv run alembic upgrade head` tambem funcionarem do host, fora de
      # qualquer container.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roteiros"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
